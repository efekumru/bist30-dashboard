<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XU030 — Direction Forecast</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0b; --border: #1c1c22; --border2: #222228;
      --green: #34d399; --red: #f87171; --yellow: #fbbf24;
      --text: #f4f4f8; --muted: #b0b0c8; --mono: 'Geist Mono', monospace;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--mono); min-height: 100vh; }

    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 44px; border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }
    .nav-meta { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 20px; }
    .nav-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
    .nav-date  { font-size: 11px; color: var(--muted); }

    .index-forecast {
      padding: 28px 44px 24px;
      border-bottom: 1px solid var(--border);
    }
    .idx-row1 { display: flex; align-items: baseline; gap: 20px; margin-bottom: 6px; flex-wrap: wrap; }
    .idx-ticker { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
    .idx-close { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    .idx-decision { font-size: 14px; font-weight: 600; }
    .idx-decision.up   { color: var(--green); }
    .idx-decision.down { color: var(--red); }
    .idx-decision.neu  { color: var(--yellow); }
    .idx-decision.na   { color: var(--muted); }
    .idx-sub { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; }

    .summary {
      padding: 28px 44px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 32px; flex-wrap: wrap;
    }
    .s-block { display: flex; align-items: baseline; gap: 8px; }
    .s-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
    .s-val   { font-size: 22px; font-weight: 700; }
    .s-val.green { color: var(--green); }
    .s-val.red   { color: var(--red);   }
    .s-val.muted { color: var(--muted); }
    .s-sep { width: 1px; height: 28px; background: var(--border2); }
    .s-sub { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; }

    .table-section { padding: 24px 44px 80px; }
    .table-controls { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
    .f-btn {
      font-family: var(--mono); font-size: 11px; font-weight: 500;
      background: transparent; border: 1px solid var(--border2);
      color: var(--muted); padding: 4px 12px; border-radius: 3px;
      cursor: pointer; transition: all .1s; letter-spacing: 0.5px;
    }
    .f-btn:hover  { border-color: var(--text); color: var(--text); }
    .f-btn.active { border-color: var(--text); color: var(--text); background: var(--border2); }
    .table-meta { margin-left: auto; font-size: 10px; color: var(--muted); }

    table { width: 100%; border-collapse: collapse; }
    thead tr { border-bottom: 1px solid var(--border2); }
    th { font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; padding: 9px 10px; text-align: left; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:hover { background: rgba(255,255,255,.015); }
    td { padding: 13px 10px; font-size: 12px; }

    .td-sym   { font-weight: 700; color: #fff; font-size: 13px; }
    .td-close { color: var(--muted); font-size: 11px; }
    .td-sig   { font-weight: 600; font-size: 12px; letter-spacing: 0.5px; }
    .td-sig.long  { color: var(--green); }
    .td-sig.short { color: var(--red);   }
    .td-sig.neu   { color: var(--muted); }

    .algo-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .algo-badge {
      font-size: 9px; font-weight: 600; letter-spacing: 0.3px;
      padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border2);
    }
    .algo-badge.up   { color: var(--green); border-color: rgba(52,211,153,.35); }
    .algo-badge.down { color: var(--red);   border-color: rgba(248,113,113,.35); }
    .algo-badge.dim  { color: var(--muted); opacity: .45; }

    .empty-row td { text-align: center; padding: 48px; color: var(--muted); font-size: 11px; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }

    @media (max-width: 768px) {
      nav, .index-forecast, .summary, .table-section { padding-left: 20px; padding-right: 20px; }
      .hide-mob { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <div class="logo">XU030 — Direction</div>
  <div class="nav-meta">
    <span class="nav-date" id="navDate">—</span>
  </div>
</nav>

<div class="index-forecast">
  <div class="idx-row1">
    <span class="idx-ticker">XU030</span>
    <span class="idx-close" id="idxClose">—</span>
    <span class="idx-decision" id="idxDecision">—</span>
  </div>
  <div class="idx-sub" id="idxDate">—</div>
</div>

<div class="summary">
  <div class="s-block">
    <span class="s-label">LONG</span>
    <span class="s-val green" id="cntLong">—</span>
  </div>
  <div class="s-sep"></div>
  <div class="s-block">
    <span class="s-label">SHORT</span>
    <span class="s-val red" id="cntShort">—</span>
  </div>
  <div class="s-sep"></div>
  <div class="s-block">
    <span class="s-label">No Signal</span>
    <span class="s-val muted" id="cntNone">—</span>
  </div>
  <div class="s-sep"></div>
  <span class="s-sub">Only models with ≥52% walk-forward accuracy count toward each signal</span>
</div>

<div class="table-section">
  <div class="table-controls">
    <button class="f-btn active" data-sig="ALL">All</button>
    <button class="f-btn" data-sig="LONG">Long</button>
    <button class="f-btn" data-sig="SHORT">Short</button>
    <div class="table-meta" id="lastUpdate">—</div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Stock</th>
        <th class="hide-mob">Close</th>
        <th>Signal</th>
        <th class="hide-mob">Models</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr class="empty-row"><td colspan="4">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
const CSV_URL = './data/bist30_tahmin.csv';
const INDEX_URL = './data/xu030_tahmin.json';
let allRows = [], activeFilter = 'ALL';

// Same 52% walk-forward-accuracy bar the Python side (BASARI_ESIGI in main.py)
// uses to decide which models' votes count toward Karar/OyOrani. Shown here
// only to grey out a model's badge when it didn't clear that bar — the vote
// itself was already excluded server-side, this just makes it visible.
const MODEL_SKILL_THRESHOLD = 52;
const ALGOS = [
  { key: 'LogisticRegression', label: 'LR'   },
  { key: 'KNN',                label: 'KNN'  },
  { key: 'DecisionTree',       label: 'DT'   },
  { key: 'XGBoost',            label: 'XGB'  },
  { key: 'LightGBM',           label: 'LGBM' },
];

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  return lines.slice(1).map(line => {
    const vals = line.split(',').map(v => v.trim().replace(/^"|"$/g, ''));
    const obj = {};
    headers.forEach((h, i) => obj[h] = vals[i] ?? '');
    return obj;
  });
}

// The model's own decision string ("Karar"/"karar") already applies the
// 0.55 / 0.45 confidence threshold (see GUVEN_ESIGI in main.py) before ever
// calling a direction — anything short of that bar comes back as NEUTRAL.
// Mapping UP -> LONG, DOWN -> SHORT and NEUTRAL -> PASS here doesn't add a
// new threshold, it just relabels the same decision to match this table.
function mapSignal(karar) {
  const k = (karar || '').toUpperCase();
  if (k.includes('NEUTRAL')) return { text: 'PASS',  cls: 'neu' };
  if (k.includes('UP'))      return { text: 'LONG',  cls: 'up'  };
  if (k.includes('DOWN'))    return { text: 'SHORT', cls: 'down' };
  return { text: '—', cls: 'na' };
}

function algoBadges(row) {
  return ALGOS.map(a => {
    const yon   = row[a.key + '_yon'];
    const cvAcc = parseFloat(row[a.key + '_cv_acc']);
    // "_guven" is the model's own confidence in whichever direction it picked
    // (p_up if it voted UP, 100 - p_up if it voted DOWN) — already computed
    // server-side, not recalculated here.
    const guven = parseFloat(row[a.key + '_guven']);
    if (yon === undefined || yon === '') return '';
    const skilled = !isNaN(cvAcc) && cvAcc >= MODEL_SKILL_THRESHOLD;
    const dir = yon === '1' ? 'UP' : 'DOWN';
    const cls = skilled ? (dir === 'UP' ? 'up' : 'down') : 'dim';
    const acc = isNaN(cvAcc) ? '—' : cvAcc.toFixed(1) + '%';
    const prob = isNaN(guven) ? '—' : guven.toFixed(0) + '%';
    return `<span class="algo-badge ${cls}" title="${a.key}: ${dir}, ${prob} probability, ${acc} CV accuracy${skilled ? '' : ' (below 52% bar, not counted)'}">${a.label} ${prob}</span>`;
  }).join('');
}

function render() {
  let rows = allRows.map(r => ({ ...r, _sig: mapSignal(r.Karar) }));

  if (activeFilter === 'LONG')       rows = rows.filter(r => r._sig.text === 'LONG');
  else if (activeFilter === 'SHORT') rows = rows.filter(r => r._sig.text === 'SHORT');
  else rows = rows.filter(r => r._sig.text === 'LONG' || r._sig.text === 'SHORT');

  const tbody = document.getElementById('tableBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="4">No signals found.</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map((r, i) => {
    const close = parseFloat(r.Kapanis);
    return `<tr style="animation:fadeIn .18s ${i * 8}ms both">
      <td class="td-sym">${r.Hisse || '—'}</td>
      <td class="td-close hide-mob">${isNaN(close) ? '—' : close.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
      <td class="td-sig ${r._sig.cls}">${r._sig.text}</td>
      <td class="hide-mob"><div class="algo-row">${algoBadges(r)}</div></td>
    </tr>`;
  }).join('');
}

async function loadIndexForecast() {
  try {
    const res = await fetch(INDEX_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error();
    const d = await res.json();

    const sig = mapSignal(d.karar);
    document.getElementById('idxClose').textContent = d.close != null
      ? d.close.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      : '—';
    const decisionEl = document.getElementById('idxDecision');
    decisionEl.textContent = sig.text;
    decisionEl.className = 'idx-decision ' + sig.cls;
    document.getElementById('idxDate').textContent = d.tarih ? 'As of ' + d.tarih : '—';
  } catch {
    const decisionEl = document.getElementById('idxDecision');
    decisionEl.textContent = '—';
    decisionEl.className = 'idx-decision na';
  }
}

async function load() {
  try {
    const res = await fetch(CSV_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error();
    allRows = parseCSV(await res.text());

    const sigs = allRows.map(r => mapSignal(r.Karar).text);
    document.getElementById('cntLong').textContent  = sigs.filter(s => s === 'LONG').length;
    document.getElementById('cntShort').textContent = sigs.filter(s => s === 'SHORT').length;
    document.getElementById('cntNone').textContent  = sigs.filter(s => s === 'PASS').length;

    const ts = new Date().toLocaleString('en-GB', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
    document.getElementById('navDate').textContent    = ts;
    document.getElementById('lastUpdate').textContent = 'Last updated: ' + ts;

    render();
  } catch {
    document.getElementById('tableBody').innerHTML =
      '<tr class="empty-row"><td colspan="4">data/ folder missing — run the Colab notebook</td></tr>';
  }
}

document.querySelectorAll('.f-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.sig;
    render();
  });
});

loadIndexForecast();
load();
setInterval(() => { loadIndexForecast(); load(); }, 5 * 60 * 1000);
</script>
</body>
</html>
